<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flag Street Race Live</title>
  <style>
    :root {
      --panel: rgba(7, 13, 24, 0.84);
      --text: #eaf2ff;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.22);
      --gold: #fde68a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 72% 8%, rgba(59, 130, 246, 0.18), transparent 33%),
        radial-gradient(circle at 42% 96%, rgba(253, 230, 138, 0.10), transparent 38%),
        linear-gradient(180deg, #020617 0%, #07111f 54%, #0f172a 100%);
      touch-action: manipulation;
    }

    #gameCanvas { display: block; width: 100vw; height: 100vh; }
    .hud { position: fixed; inset: 0; pointer-events: none; }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(16px);
      border-radius: 18px;
    }

    .topMini {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 16px;
      min-width: min(420px, calc(100vw - 16px));
      pointer-events: none;
    }

    .topPill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text);
      font-weight: 950;
      font-size: 14px;
      white-space: nowrap;
    }

    .topPill small {
      color: var(--muted);
      font-weight: 900;
      font-size: 11px;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .miniFlag {
      position: relative;
      width: 42px;
      height: 28px;
      border-radius: 8px;
      overflow: hidden;
      flex: 0 0 auto;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.30), 0 4px 12px rgba(0,0,0,0.22);
    }

    .controlDock {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: min(1080px, calc(100vw - 14px));
      max-height: 35vh;
      padding: 9px;
      pointer-events: auto;
      overflow: auto;
    }

    .dockHeader {
      display: grid;
      grid-template-columns: 1fr 82px auto auto;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }

    .dockLabel {
      color: var(--muted);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .teamGrid {
      display: grid;
      grid-template-columns: repeat(6, minmax(116px, 1fr));
      gap: 7px;
    }

    .teamCard {
      min-width: 0;
      padding: 7px;
      border-radius: 15px;
      background: rgba(15, 23, 42, 0.48);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .teamHead {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }

    .teamMeta { min-width: 0; }
    .teamMeta strong { display: block; font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .teamMeta span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    .cardActions { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .progress { height: 7px; background: rgba(148, 163, 184, 0.16); border-radius: 999px; overflow: hidden; margin-top: 7px; }
    .fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #93c5fd, #fff); transition: width 220ms ease; }

    .audioStatus {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
      align-self: center;
    }

    input, button, select, label.fileLabel {
      font: inherit;
      border: 0;
      outline: 0;
      border-radius: 12px;
    }

    input, select {
      width: 100%;
      padding: 8px 9px;
      color: var(--text);
      background: rgba(2, 6, 23, 0.66);
      border: 1px solid rgba(148, 163, 184, 0.24);
      font-size: 13px;
    }

    button, label.fileLabel {
      cursor: pointer;
      color: #06101f;
      background: linear-gradient(180deg, #e0f2fe, #93c5fd);
      font-weight: 950;
      padding: 8px 9px;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 13px;
    }

    button.secondary, label.fileLabel.secondary {
      color: var(--text);
      background: rgba(30, 41, 59, 0.90);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: none;
    }

    .centerMessage {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: min(700px, calc(100vw - 32px));
      padding: 24px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 260ms ease;
    }

    .centerMessage.show { opacity: 1; }
    .centerMessage .big { font-size: clamp(32px, 5.6vw, 66px); font-weight: 950; line-height: 1; margin-bottom: 10px; }
    .centerMessage .sub { color: var(--muted); font-size: clamp(14px, 1.8vw, 20px); }

    @media (max-width: 1050px) {
      .teamGrid { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .controlDock { max-height: 39vh; }
    }

    @media (max-width: 640px) {
      .topMini {
        top: 6px;
        padding: 7px 10px;
        min-width: calc(100vw - 12px);
      }

      .topPill { font-size: 12px; gap: 6px; }
      .topPill small { font-size: 9px; }

      .controlDock {
        bottom: 6px;
        width: calc(100vw - 10px);
        max-height: 43vh;
        padding: 7px;
        border-radius: 15px;
      }

      .dockHeader { grid-template-columns: 1fr 70px auto; gap: 6px; }
      .dockLabel { grid-column: 1 / 3; font-size: 10px; }
      .teamGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .teamCard { padding: 6px; }
      .teamHead { grid-template-columns: 32px 1fr; gap: 6px; }
      .miniFlag { width: 32px; height: 22px; border-radius: 7px; }
      .teamMeta strong { font-size: 12px; }
      .teamMeta span { font-size: 10px; }
      .cardActions { grid-template-columns: 1fr 52px; }
      input, select, button, label.fileLabel { font-size: 12px; padding: 7px 6px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="topMini glass">
      <div class="topPill" id="leaderText"><small>Lider</small><span>---</span></div>
    </div>

    <section class="controlDock glass">
      <div class="dockHeader">
        <div class="dockLabel">Hediye seç → puan yaz → ülkeye + ekle</div>
        <select id="giftSelect"></select>
        <input id="activePointInput" type="number" min="1" max="1000" step="1" value="1" />
        <button id="audioUnlockBtn" class="secondary">Ses Aç</button>
      </div>
      <div id="teamGrid" class="teamGrid"></div>
    </section>

    <div id="centerMessage" class="centerMessage glass">
      <div id="centerBig" class="big">Başlıyor</div>
      <div id="centerSub" class="sub">Her ülkenin hediyesi arabanın önünde sürekli akar.</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const leaderText = document.getElementById('leaderText');
    const teamGridEl = document.getElementById('teamGrid');
    const giftSelect = document.getElementById('giftSelect');
    const activePointInput = document.getElementById('activePointInput');
    const centerMessage = document.getElementById('centerMessage');
    const centerBig = document.getElementById('centerBig');
    const centerSub = document.getElementById('centerSub');

    const TARGET_SCORE = 1000;
    const MID_SCORE = 200;
    let lastTime = performance.now();
    let dpr = 1;
    let raceEnded = false;
    let audioUnlocked = false;
    let activeAnthemCode = null;
    const anthemAudio = {};

    const GIFT_POWER = {
      // Türkiye bölgesinde StreamToEarn listesinde 1 coin görünen öne çıkan hediyeler.
      'Pop': 1,
      'Rose': 1,
      'GG': 1,
      'Love you so much': 1,
      'Cake Slice': 1,
      'Creeper': 1,
      'Glow Stick': 1,
      'TikTok': 1,
      'Wink wink': 1,
      'Freestyle': 1,
      'Oldies': 1,
      'Ice Cream Cone': 1,
      'Heart Me': 1,
      'Congratulations': 1,
      'So Cute': 1,
      'Placeholder': 1,
      'Thumbs Up': 1,
      'Heart': 1,
      'Love you': 1,
      'Happy Bairam': 1,
      'Tulip': 1,
      'Music Album': 1,
      'Parliyorsun!': 1,
      'Cherry cake': 1,
      'Go Popular': 1,
      'Club Cheers': 1,
      'Wink Charm': 1
    };

    const GIFT_ICON_URLS = {
      // Bu dosyaları GitHub repo içinde aynı isimlerle koy:
      // /assets/gifts/pop.png, /assets/gifts/rose.png, /assets/gifts/gg.png ...
      // Böylece yanlış emoji değil, gerçek TikTok hediye PNG görselleri kullanılır.
      'Pop': 'assets/gifts/pop.png',
      'Rose': 'assets/gifts/rose.png',
      'GG': 'assets/gifts/gg.png',
      'Love you so much': 'assets/gifts/love-you-so-much.png',
      'Cake Slice': 'assets/gifts/cake-slice.png',
      'Creeper': 'assets/gifts/creeper.png',
      'Glow Stick': 'assets/gifts/glow-stick.png',
      'TikTok': 'assets/gifts/tiktok.png',
      'Wink wink': 'assets/gifts/wink-wink.png',
      'Freestyle': 'assets/gifts/freestyle.png',
      'Oldies': 'assets/gifts/oldies.png',
      'Ice Cream Cone': 'assets/gifts/ice-cream-cone.png',
      'Heart Me': 'assets/gifts/heart-me.png',
      'Congratulations': 'assets/gifts/congratulations.png',
      'So Cute': 'assets/gifts/so-cute.png',
      'Placeholder': 'assets/gifts/placeholder.png',
      'Thumbs Up': 'assets/gifts/thumbs-up.png',
      'Heart': 'assets/gifts/heart.png',
      'Love you': 'assets/gifts/love-you.png',
      'Happy Bairam': 'assets/gifts/happy-bairam.png',
      'Tulip': 'assets/gifts/tulip.png',
      'Music Album': 'assets/gifts/music-album.png',
      'Parliyorsun!': 'assets/gifts/parliyorsun.png',
      'Cherry cake': 'assets/gifts/cherry-cake.png',
      'Go Popular': 'assets/gifts/go-popular.png',
      'Club Cheers': 'assets/gifts/club-cheers.png',
      'Wink Charm': 'assets/gifts/wink-charm.png',
      'Gift': 'assets/gifts/gift.png'
    };

    const TEAM_DEFAULT_GIFT = {
      TR: 'Rose',
      AZ: 'GG',
      SYR: 'TikTok',
      AFG: 'Ice Cream Cone',
      TKM: 'Thumbs Up',
      KURD: 'Heart Me'
    };

    const ANTHEM_URLS = {
      // Bu MP3 dosyalarını GitHub repo içinde aynı isimlerle koy:
      // /assets/anthems/tr.mp3, /assets/anthems/az.mp3 ...
      TR: 'assets/anthems/tr.mp3',
      AZ: 'assets/anthems/az.mp3',
      SYR: 'assets/anthems/syr.mp3',
      AFG: 'assets/anthems/afg.mp3',
      TKM: 'assets/anthems/tkm.mp3',
      KURD: 'assets/anthems/kurd.mp3'
    };

    const giftImages = {};
    Object.entries(GIFT_ICON_URLS).forEach(([name, url]) => {
      const img = new Image();
      img.src = url;
      img.onerror = () => { img.dataset.failed = '1'; };
      giftImages[name] = img;
    });

    Object.entries(ANTHEM_URLS).forEach(([code, url]) => {
      const audio = new Audio(url);
      audio.loop = true;
      audio.volume = 0.42;
      audio.preload = 'auto';
      anthemAudio[code] = audio;
    });

    const teams = [
      { code: 'TR', aliases: ['TR', 'TURKEY', 'TURKIYE', 'TÜRKİYE'], name: 'Türkiye', color: '#c1121f', accent: '#ffffff', carType: 'gt' },
      { code: 'AZ', aliases: ['AZ', 'AZE', 'AZERBAIJAN', 'AZERBAYCAN'], name: 'Azerbaycan', color: '#0096c7', accent: '#ef3340', carType: 'rally' },
      { code: 'SYR', aliases: ['SYR', 'SYRIA', 'SURIYE', 'SURİYE'], name: 'Suriye', color: '#16a34a', accent: '#ef4444', carType: 'muscle' },
      { code: 'AFG', aliases: ['AFG', 'AFGHANISTAN', 'AFGANISTAN', 'AFGANİSTAN'], name: 'Afganistan', color: '#111827', accent: '#ef4444', carType: 'suv' },
      { code: 'TKM', aliases: ['TKM', 'TM', 'TURKMENISTAN', 'TÜRKMENİSTAN'], name: 'Türkmenistan', color: '#0f766e', accent: '#f8fafc', carType: 'hyper' },
      { code: 'KURD', aliases: ['KURD', 'KURDISTAN', 'KÜRDİSTAN'], name: 'Kurd', color: '#f59e0b', accent: '#ffffff', carType: 'formula' }
    ].map((team, index) => ({
      ...team,
      score: 0,
      displayScore: 0,
      x: 0,
      y: 0,
      lane: index,
      pulse: 0,
      glow: 0,
      rank: index + 1,
      audio: null
    }));

    const particles = [];
    const floatingTexts = [];
    const speedLines = [];
    const giftSprites = [];

    function resize() {
      dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutTeams(true);
    }

    function dockReservedHeight() {
      const w = window.innerWidth;
      if (w <= 640) return Math.min(300, Math.max(218, window.innerHeight * 0.36));
      if (w <= 1050) return Math.min(260, Math.max(205, window.innerHeight * 0.32));
      return 170;
    }

    function trackBounds() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const leftPad = w <= 640 ? 72 : w <= 1050 ? 94 : 116;
      const top = w <= 640 ? 82 : 94;
      const bottom = h - dockReservedHeight() - 18;
      return {
        startX: leftPad,
        finishX: w - (w <= 640 ? 54 : 76),
        top,
        bottom: Math.max(top + 206, bottom)
      };
    }

    function layoutTeams(force) {
      const b = trackBounds();
      const laneGap = (b.bottom - b.top) / Math.max(1, teams.length - 1);
      teams.forEach((team, i) => {
        team.y = b.top + i * laneGap;
        const targetX = scoreToX(team.displayScore, b);
        if (force || !team.x) team.x = targetX;
      });
    }

    function scoreProgress(score) {
      const s = Math.max(0, Math.min(TARGET_SCORE, score));
      if (s <= MID_SCORE) return (s / MID_SCORE) * 0.5;
      return 0.5 + ((s - MID_SCORE) / (TARGET_SCORE - MID_SCORE)) * 0.5;
    }

    function scoreToX(score, b) {
      const t = scoreProgress(score);
      return b.startX + (b.finishX - b.startX - 82) * t;
    }

    function normalizeText(text) {
      return String(text || '').trim().toUpperCase().replaceAll('_', ' ').replaceAll('-', ' ').split(' ').filter(Boolean).join(' ');
    }

    function findTeamByComment(text) {
      const normalized = normalizeText(text).replaceAll(' ', '');
      if (!normalized) return null;
      return teams.find(team => team.aliases.some(alias => normalizeText(alias).replaceAll(' ', '') === normalized)) || teams.find(team => normalized.includes(team.code));
    }

    function getGiftPower(giftNameOrValue, repeatCount) {
      if (typeof giftNameOrValue === 'number') return Math.max(1, giftNameOrValue) * Math.max(1, repeatCount || 1);
      const key = Object.keys(GIFT_POWER).find(name => normalizeText(name) === normalizeText(giftNameOrValue));
      const base = key ? GIFT_POWER[key] : 1;
      return base * Math.max(1, Number(repeatCount) || 1);
    }

    function addPoints(team, amount, giftName, userName) {
      unlockAudio();
      if (!team || raceEnded) return false;
      const points = Math.max(1, Math.floor(Number(amount) || 1));
      const before = team.score;
      team.score = Math.min(TARGET_SCORE, team.score + points);
      team.pulse = 1;
      team.glow = 1;

      spawnParticles(team.x - 42, team.y + 22, team.color, Math.min(42, 8 + points / 5));
      spawnSpeedLines(team.x - 58, team.y, Math.min(24, 5 + points / 8));
      spawnGiftSprite(team, giftName || selectedGiftName(), points);
      addFloatingText(team.x, team.y - 38, '+' + points + ' ' + team.code, team.color);
      updatePanels();
      updateAnthem();

      if (before < TARGET_SCORE && team.score >= TARGET_SCORE) finishRace(team);
      return true;
    }

    function spawnGiftSprite(team, giftName, points) {
      giftSprites.push({
        team,
        giftName: giftName || 'Gift',
        points,
        age: 0,
        life: 1.12,
        startOffset: 18,
        endOffset: 94,
        bob: Math.random() * Math.PI * 2
      });
    }

    function finishRace(team) {
      raceEnded = true;
      team.score = TARGET_SCORE;
      showCenterMessage(team.name + ' Kazandı!', '1000 puana ulaştı. Sayfayı yenileyerek yeni yarış başlatabilirsin.', 8000);
    }

    function applyComment(userName, comment) {
      const team = findTeamByComment(comment);
      return !!team;
    }

    function applyGift(userName, teamCodeOrComment, giftNameOrValue, repeatCount) {
      const team = findTeamByComment(teamCodeOrComment);
      if (!team) return false;
      const giftName = typeof giftNameOrValue === 'number' ? 'Gift' : String(giftNameOrValue || 'Rose');
      const power = getGiftPower(giftNameOrValue || 'Rose', repeatCount || 1);
      return addPoints(team, power, giftName, userName || 'viewer');
    }

    window.applyTikTokComment = applyComment;
    window.applyTikTokGift = applyGift;
    window.addTeamPoints = function(teamCode, points) {
      const team = findTeamByComment(teamCode);
      return addPoints(team, points, selectedGiftName(), 'manual');
    };

    function selectedPoints() {
      const value = Math.max(1, Math.floor(Number(activePointInput.value) || 1));
      activePointInput.value = value;
      if (giftSelect.value) GIFT_POWER[giftSelect.value] = value;
      return value;
    }

    function selectedGiftName() { return giftSelect.value || 'Rose'; }

    function buildControls() {
      giftSelect.innerHTML = Object.keys(GIFT_POWER).map(name => '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>').join('');
      giftSelect.addEventListener('change', () => { activePointInput.value = GIFT_POWER[giftSelect.value] || 1; });
      activePointInput.addEventListener('change', selectedPoints);
      activePointInput.value = GIFT_POWER[selectedGiftName()] || 1;

      teamGridEl.innerHTML = teams.map(team => teamCardHtml(team)).join('');
      teamGridEl.querySelectorAll('[data-add-team]').forEach(btn => {
        btn.addEventListener('click', () => {
          const team = teams.find(t => t.code === btn.dataset.addTeam);
          addPoints(team, selectedPoints(), selectedGiftName(), 'manual');
        });
      });
      const audioBtn = document.getElementById('audioUnlockBtn');
      if (audioBtn) audioBtn.addEventListener('click', unlockAudio);
    }

    function teamCardHtml(team) {
      return '<div class="teamCard" id="card_' + team.code + '">' +
        '<div class="teamHead">' +
          '<div class="miniFlag">' + flagMarkup(team.code) + '</div>' +
          '<div class="teamMeta"><strong>' + escapeHtml(team.name) + '</strong><span id="score_' + team.code + '">0 / 1000</span></div>' +
        '</div>' +
        '<div class="cardActions">' +
          '<button data-add-team="' + team.code + '">+ Ekle</button>' +
        '</div>' +
        '<div class="progress"><div id="fill_' + team.code + '" class="fill" style="background: linear-gradient(90deg, ' + team.color + ', rgba(255,255,255,0.90));"></div></div>' +
      '</div>';
    }

    function updatePanels() {
      updateRanks();
      teams.forEach(team => {
        const scoreEl = document.getElementById('score_' + team.code);
        const fillEl = document.getElementById('fill_' + team.code);
        if (scoreEl) scoreEl.textContent = team.score + ' / ' + TARGET_SCORE + '  •  #' + team.rank;
        if (fillEl) fillEl.style.width = Math.min(100, scoreProgress(team.score) * 100) + '%';
      });
      updateLeaderUI();
    }

    function getLeader() {
      return [...teams].sort((a, b) => b.score - a.score || b.displayScore - a.displayScore)[0];
    }

    function updateRanks() {
      const ranked = [...teams].sort((a, b) => b.score - a.score || b.displayScore - a.displayScore);
      ranked.forEach((team, index) => team.rank = index + 1);
    }

    function updateLeaderUI() {
      const leader = getLeader();
      if (!leader) return;
      leaderText.innerHTML = '<small>Lider</small>' + miniFlagHtml(leader) + '<span>' + escapeHtml(leader.code) + ' • ' + leader.score + '</span>';
      updateAnthem();
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      Object.values(anthemAudio).forEach(audio => {
        audio.volume = 0;
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          audio.volume = 0.42;
        }).catch(() => {
          audio.volume = 0.42;
        });
      });
      const btn = document.getElementById('audioUnlockBtn');
      if (btn) btn.textContent = 'Ses Açık';
      setTimeout(updateAnthem, 120);
    }

    function updateAnthem() {
      if (!audioUnlocked) return;
      const leader = getLeader();
      if (!leader || activeAnthemCode === leader.code) return;
      activeAnthemCode = leader.code;
      Object.entries(anthemAudio).forEach(([code, audio]) => {
        if (code !== leader.code) {
          audio.pause();
          audio.currentTime = 0;
        }
      });
      const active = anthemAudio[leader.code];
      if (active) {
        active.volume = 0.42;
        active.loop = true;
        active.play().catch(() => {});
      }
    }

    function escapeHtml(value) {
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }

    function miniFlagHtml(team) {

    function drawGiftSprites(dt) {

        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#fff';
        ctx.font = '950 ' + Math.max(11, size * 0.28) + 'px system-ui';
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(2,6,23,0.88)';
        ctx.lineWidth = 4;
        const txt = '+' + g.points;
        ctx.strokeText(txt, x, y + size * 0.77);
        ctx.fillText(txt, x, y + size * 0.77);
        ctx.restore();
      }
    }

    function drawFallbackGift(x, y, size, color) {
      ctx.save();
      ctx.fillStyle = color;
      roundRect(ctx, x - size * 0.36, y - size * 0.22, size * 0.72, size * 0.52, size * 0.08);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - size * 0.06, y - size * 0.22, size * 0.12, size * 0.52);
      ctx.fillRect(x - size * 0.36, y - size * 0.02, size * 0.72, size * 0.10);
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.arc(x - size * 0.12, y - size * 0.30, size * 0.14, 0, Math.PI * 2);
      ctx.arc(x + size * 0.12, y - size * 0.30, size * 0.14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life -= dt; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vx *= 0.985; p.vy *= 0.985;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.maxLife); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
    }

    function drawSpeedLines(dt) {
      for (let i = speedLines.length - 1; i >= 0; i--) {
        const s = speedLines[i]; s.life -= dt; s.x -= 2.2 * dt * 60;
        if (s.life <= 0) { speedLines.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, s.life / s.maxLife) * 0.55; ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.len,s.y); ctx.stroke(); ctx.restore();
      }
    }

    function drawFloatingTexts(dt) {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const f = floatingTexts[i]; f.age += dt; f.life -= dt; f.y -= dt * 28;
        if (f.life <= 0) { floatingTexts.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, f.life); ctx.textAlign = 'center'; ctx.font = '950 18px system-ui'; ctx.strokeStyle = 'rgba(2,6,23,0.85)'; ctx.lineWidth = 5; ctx.strokeText(f.text,f.x,f.y); ctx.fillStyle = '#fff'; ctx.fillText(f.text,f.x,f.y); ctx.restore();
      }
    }

    function update(dt) {
      const b = trackBounds();
      teams.forEach(team => {
        team.displayScore += (team.score - team.displayScore) * Math.min(1, dt * 6.8);
        const targetX = scoreToX(team.displayScore, b);
        team.x += (targetX - team.x) * Math.min(1, dt * 9);
        team.pulse *= Math.pow(0.86, dt * 60);
        team.glow *= Math.pow(0.90, dt * 60);
      });
    }

    function draw() {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastTime) / 1000); lastTime = now;
      const time = now / 1000;
      const w = window.innerWidth, h = window.innerHeight;

      update(dt);
      layoutTeams(false);
      drawBackground(w,h);
      drawSpeedLines(dt);

      const sortedTeams = [...teams].sort((a,b)=>a.y-b.y);
      sortedTeams.forEach(team => {
        drawCar(team);
        drawPersistentFrontGift(team, time);
      });

      drawGiftSprites(dt);
      drawParticles(dt);
      drawFloatingTexts(dt);
      requestAnimationFrame(draw);
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.PI + (Math.random()-0.5)*1.25;
        const speed = 0.7 + Math.random()*3.0;
        particles.push({x,y,vx:Math.cos(angle)*speed-1.8,vy:Math.sin(angle)*speed,life:0.65+Math.random()*0.45,maxLife:1.1,size:2+Math.random()*4,color});
      }
    }
    function spawnSpeedLines(x, y, count) { for (let i=0;i<count;i++) speedLines.push({x:x-Math.random()*48,y:y+(Math.random()-0.5)*44,len:28+Math.random()*48,life:0.38+Math.random()*0.26,maxLife:0.62}); }
    function addFloatingText(x, y, text, color) { floatingTexts.push({x,y,text,color,life:1.05,age:0}); }
    function showCenterMessage(big, sub, duration) { centerBig.textContent = big; centerSub.textContent = sub; centerMessage.classList.add('show'); clearTimeout(showCenterMessage.t); showCenterMessage.t = setTimeout(()=>centerMessage.classList.remove('show'), duration || 2600); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function darkenColor(hex, amount) { return mixColor(hex, '#020617', amount); }
    function lightenColor(hex, amount) { return mixColor(hex, '#ffffff', amount); }
    function mixColor(hex, other, amount) { const a=hexToRgb(hex), b=hexToRgb(other); const r=Math.round(a.r+(b.r-a.r)*amount), g=Math.round(a.g+(b.g-a.g)*amount), bl=Math.round(a.b+(b.b-a.b)*amount); return 'rgb('+r+', '+g+', '+bl+')'; }
    function hexToRgb(hex) { const clean=hex.replace('#',''); const bigint=parseInt(clean,16); return {r:(bigint>>16)&255,g:(bigint>>8)&255,b:bigint&255}; }
    function roundRect(ctx,x,y,w,h,r){ const radius=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+radius,y); ctx.arcTo(x+w,y,x+w,y+h,radius); ctx.arcTo(x+w,y+h,x,y+h,radius); ctx.arcTo(x,y+h,x,y,radius); ctx.arcTo(x,y,x+radius,y,radius); ctx.closePath(); }
    function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    function star(cx,cy,outer,inner,color){ ctx.save(); ctx.fillStyle=color; ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const r=i%2===0?outer:inner; const x=cx+Math.cos(a)*r; const y=cy+Math.sin(a)*r; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.closePath(); ctx.fill(); ctx.restore(); }

    window.addEventListener('resize', resize);
    window.addEventListener('pointerdown', unlockAudio, { once: true });

    resize();
    buildControls();
    updatePanels();
    showCenterMessage('Yarış Hazır!', 'Üstte sadece lider var. Ülke hediyeleri arabaların önünde sürekli akar.', 3200);
    requestAnimationFrame(draw);
  </script>
</body>
