<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flag Street Race Live</title>
  <style>
    :root {
      --panel: rgba(7, 13, 24, 0.78);
      --text: #eaf2ff;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.20);
      --gold: #fde68a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: manipulation;
      user-select: none;
    }

    body {
      background:
        radial-gradient(circle at 72% 8%, rgba(59, 130, 246, 0.18), transparent 33%),
        radial-gradient(circle at 42% 96%, rgba(253, 230, 138, 0.10), transparent 38%),
        linear-gradient(180deg, #020617 0%, #07111f 54%, #0f172a 100%);
    }

    #gameCanvas { display: block; width: 100vw; height: 100vh; }

    #youtubePlayer {
      position: fixed;
      left: -260px;
      top: -260px;
      width: 220px;
      height: 220px;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }
    .hud { position: fixed; inset: 0; pointer-events: none; }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(16px);
      border-radius: 18px;
    }

    .topMini {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 16px;
      min-width: min(380px, calc(100vw - 16px));
      pointer-events: none;
    }

    .topPill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text);
      font-weight: 950;
      font-size: 14px;
      white-space: nowrap;
    }

    .topPill small {
      color: var(--muted);
      font-weight: 900;
      font-size: 11px;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .miniFlag {
      position: relative;
      width: 42px;
      height: 28px;
      border-radius: 8px;
      overflow: hidden;
      flex: 0 0 auto;
      background: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.30), 0 4px 12px rgba(0,0,0,0.22);
    }

    .seriesBoard {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: min(820px, calc(100vw - 16px));
      padding: 4px 6px;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 5px;
      pointer-events: none;
      background: rgba(7, 13, 24, 0.34);
      border: 1px solid rgba(148, 163, 184, 0.10);
      box-shadow: 0 8px 24px rgba(0,0,0,0.20);
      border-radius: 12px;
    }

    .seriesChip {
      min-width: 0;
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: center;
      gap: 4px;
      padding: 3px 4px;
      border-radius: 9px;
      background: rgba(15, 23, 42, 0.32);
      border: 1px solid rgba(148, 163, 184, 0.10);
    }

    .seriesChip .miniFlag {
      width: 22px;
      height: 15px;
      border-radius: 5px;
    }

    .seriesInfo {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .seriesName {
      display: block;
      font-size: 9px;
      line-height: 1;
      font-weight: 950;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seriesScore {
      flex: 0 0 auto;
      font-size: 12px;
      line-height: 1;
      font-weight: 1000;
      color: #fde68a;
      text-shadow: 0 2px 8px rgba(0,0,0,0.82);
      font-variant-numeric: tabular-nums;
    }

    .controlDock {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: min(1080px, calc(100vw - 14px));
      max-height: 29vh;
      padding: 8px;
      pointer-events: auto;
      overflow: auto;
    }

    .dockHeader {
      display: grid;
      grid-template-columns: 1fr 82px 92px 82px;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }

    .teamGrid {
      display: grid;
      grid-template-columns: repeat(6, minmax(116px, 1fr));
      gap: 7px;
    }

    .teamCard {
      min-width: 0;
      padding: 7px;
      border-radius: 15px;
      background: rgba(15, 23, 42, 0.48);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .teamHead {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 7px;
      align-items: center;
      margin-bottom: 7px;
    }

    .teamMeta { min-width: 0; }
    .teamMeta strong { display: block; font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .teamMeta span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    .cardActions { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .progress { height: 7px; background: rgba(148, 163, 184, 0.16); border-radius: 999px; overflow: hidden; margin-top: 7px; }
    .fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #93c5fd, #fff); transition: width 220ms ease; }

    input, button, select { font: inherit; border: 0; outline: 0; border-radius: 12px; }

    input, select {
      width: 100%;
      padding: 8px 9px;
      color: var(--text);
      background: rgba(2, 6, 23, 0.66);
      border: 1px solid rgba(148, 163, 184, 0.24);
      font-size: 13px;
    }

    button {
      cursor: pointer;
      color: #06101f;
      background: linear-gradient(180deg, #e0f2fe, #93c5fd);
      font-weight: 950;
      padding: 8px 9px;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 13px;
    }

    button.secondary {
      color: var(--text);
      background: rgba(30, 41, 59, 0.90);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: none;
    }

    .centerMessage {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: min(700px, calc(100vw - 32px));
      padding: 24px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 260ms ease;
    }

    .centerMessage.show { opacity: 1; }
    .centerMessage .big { font-size: clamp(32px, 5.6vw, 66px); font-weight: 950; line-height: 1; margin-bottom: 10px; }
    .centerMessage .sub { color: var(--muted); font-size: clamp(14px, 1.8vw, 20px); }

    @media (max-width: 1050px) {
      .teamGrid { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .controlDock { max-height: 32vh; }
    }

    @media (max-width: 640px) {
      .glass { backdrop-filter: none; }

      .topMini {
        top: 6px;
        padding: 7px 10px;
        min-width: calc(100vw - 12px);
        border-radius: 15px;
      }

      .topPill { font-size: 13px; gap: 6px; }
      .topPill small { font-size: 9px; }

      .seriesBoard {
        top: 46px;
        width: calc(100vw - 10px);
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
        padding: 3px;
        border-radius: 11px;
        background: rgba(7, 13, 24, 0.30);
      }

      .seriesChip {
        grid-template-columns: 20px 1fr;
        gap: 3px;
        padding: 3px;
        border-radius: 8px;
      }

      .seriesChip .miniFlag {
        width: 20px;
        height: 14px;
      }

      .seriesName { font-size: 8px; }
      .seriesScore { font-size: 11px; }

      .controlDock {
        bottom: 6px;
        width: calc(100vw - 10px);
        max-height: 20vh;
        padding: 6px;
        border-radius: 15px;
      }

      .dockHeader {
        grid-template-columns: 1fr 50px 62px 66px;
        gap: 5px;
        margin-bottom: 6px;
      }

      .teamGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
      .teamCard { padding: 5px; border-radius: 12px; }
      .teamHead { grid-template-columns: 28px 1fr; gap: 5px; margin-bottom: 4px; }
      .miniFlag { width: 28px; height: 19px; border-radius: 6px; }
      .teamMeta strong { font-size: 10.5px; }
      .teamMeta span, .progress { display: none; }
      .cardActions { grid-template-columns: 1fr; gap: 0; }
      input, select, button { font-size: 10.5px; padding: 6px 4px; border-radius: 10px; }
      .centerMessage { top: 38%; padding: 18px; }
    }

    @media (max-width: 640px) and (max-height: 620px) {
      .controlDock { max-height: 18vh; }
      .seriesBoard { top: 44px; }
      .topMini { padding: 6px 9px; }
      .teamCard { padding: 4px; }
      input, select, button { font-size: 10.5px; padding: 5px 4px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="youtubePlayer"></div>

  <div class="hud">
    <div class="topMini glass">
      <div class="topPill" id="leaderText"><small>Lider</small><span>---</span></div>
      <div class="topPill" id="seriesText"><small>Seri</small><span>0 / 5</span></div>
    </div>

    <div class="seriesBoard glass" id="seriesBoard"></div>

    <section class="controlDock glass">
      <div class="dockHeader">
        <select id="giftSelect"></select>
        <input id="activePointInput" type="number" min="1" max="1000" step="1" value="1" />
        <button id="fullscreenBtn" class="secondary">Tam Ekran</button>
        <button id="audioUnlockBtn" class="secondary">Müzik Aç</button>
      </div>
      <div id="teamGrid" class="teamGrid"></div>
    </section>

    <div id="centerMessage" class="centerMessage glass">
      <div id="centerBig" class="big">Yarış Hazır</div>
      <div id="centerSub" class="sub">Hediyeler arabaları ileri taşır.</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const leaderText = document.getElementById('leaderText');
    const seriesText = document.getElementById('seriesText');
    const seriesBoard = document.getElementById('seriesBoard');
    const teamGridEl = document.getElementById('teamGrid');
    const giftSelect = document.getElementById('giftSelect');
    const activePointInput = document.getElementById('activePointInput');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const centerMessage = document.getElementById('centerMessage');
    const centerBig = document.getElementById('centerBig');
    const centerSub = document.getElementById('centerSub');

    const TARGET_SCORE = 1000;
    const SERIES_TARGET = 5;
    const AUTO_NEXT_RACE_DELAY = 3600;

    let lastTime = performance.now();
    let dpr = 1;
    let raceEnded = false;
    let gameOver = false;
    let raceNumber = 1;
    let audioUnlocked = false;
    let activeAnthemCode = null;
    let youtubeApiLoading = false;
    let youtubeReady = false;
    let youtubePlayer = null;
    let pendingYoutubeTeamCode = null;

    const anthemAudio = {};
    const giftImages = {};
    const viewerTeamByUser = new Map();

    const TR_ONE_COIN_GIFTS = [
      {
        name: 'Rose',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp'
      },
      {
        name: 'GG',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/3f02fa9594bd1495ff4e8aa5ae265eef~tplv-obj.webp'
      },
      {
        name: 'TikTok',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/802a21ae29f9fae5abe3693de9f874bd~tplv-obj.webp'
      },
      {
        name: 'Pop',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/alisg/webcast-sg/resource/0b4f61e8ab637f11449300d03929ef87.png~tplv-obj.webp'
      },
      {
        name: 'Ice Cream Cone',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/968820bc85e274713c795a6aef3f7c67~tplv-obj.webp'
      },
      {
        name: 'Heart Me',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/d56945782445b0b8c8658ed44f894c7b~tplv-obj.webp'
      },
      {
        name: 'Thumbs Up',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/570a663e27bdc460e05556fd1596771a~tplv-obj.webp'
      },
      {
        name: 'Heart',
        power: 1,
        img: 'https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/dd300fd35a757d751301fba862a258f1~tplv-obj.webp'
      }
    ];

    const GIFT_POWER = Object.fromEntries(TR_ONE_COIN_GIFTS.map(g => [g.name, g.power]));

    const TEAM_DEFAULT_GIFT = {
      TR: 'Rose',
      AZ: 'GG',
      SYR: 'TikTok',
      AFG: 'Ice Cream Cone',
      TKM: 'Pop',
      KURD: 'Heart Me'
    };

    const USE_YOUTUBE_MUSIC = true;

    const TEAM_YOUTUBE_IDS = {
      // İnternetten çalar. Video ID'leri istersen sonradan sadece buradan değiştirirsin.
      TR: '7VG5HU9U4QY',      // Mehter / hücum tarzı
      KURD: 'uO5n1l2GvIc',    // Davul-zurna / halay tarzı
      AZ: 'E-F4ct7t0kw',      // Azerbaycan enstrümantal tarzı
      SYR: 'WDqH-fFOLvQ',     // Davul-zurna hareketli tarz
      AFG: 'uO5n1l2GvIc',     // Geçici hareketli ritim
      TKM: 'tayQ3owTkDE'      // Geçici hareketli ritim
    };

    const TEAM_MUSIC_URLS = {
      // USE_YOUTUBE_MUSIC false yapılırsa bu direkt MP3 linkleri kullanılır.
      TR: 'assets/music/turkiye-mehter.mp3',
      KURD: 'assets/music/kurdistan-davul-zurna.mp3',
      AZ: 'assets/music/azerbaycan-race.mp3',
      SYR: 'assets/music/suriye-race.mp3',
      AFG: 'assets/music/afganistan-race.mp3',
      TKM: 'assets/music/turkmenistan-race.mp3'
    };

    const teams = [
      { code: 'TR', aliases: ['TR', 'TURKEY', 'TURKIYE', 'TÜRKİYE', 'TURK'], name: 'Türkiye', color: '#c1121f', accent: '#ffffff', carType: 'gt' },
      { code: 'KURD', aliases: ['J', 'KURD', 'KURDISTAN', 'KÜRDİSTAN', 'KURT', 'KÜRT'], name: 'Kürdistan', color: '#f59e0b', accent: '#ffffff', carType: 'formula' },
      { code: 'AZ', aliases: ['AZ', 'AZE', 'AZERBAIJAN', 'AZERBAYCAN', 'AZƏRBAYCAN'], name: 'Azerbaycan', color: '#0096c7', accent: '#ef3340', carType: 'rally' },
      { code: 'SYR', aliases: ['SYR', 'SYRIA', 'SURIYE', 'SURİYE', 'SURIYELI', 'SURİYELİ'], name: 'Suriye', color: '#16a34a', accent: '#ef4444', carType: 'muscle' },
      { code: 'AFG', aliases: ['AFG', 'AFGHANISTAN', 'AFGANISTAN', 'AFGANİSTAN'], name: 'Afganistan', color: '#111827', accent: '#ef4444', carType: 'suv' },
      { code: 'TKM', aliases: ['TKM', 'TM', 'TURKMENISTAN', 'TÜRKMENİSTAN', 'TURKMEN'], name: 'Türkmenistan', color: '#0f766e', accent: '#f8fafc', carType: 'hyper' }
    ].map((team, index) => ({
      ...team,
      score: 0,
      displayScore: 0,
      x: 0,
      y: 0,
      lane: index,
      pulse: 0,
      glow: 0,
      rank: index + 1,
      raceWins: 0
    }));

    const particles = [];
    const floatingTexts = [];
    const speedLines = [];
    const giftSprites = [];

    function preloadAssets() {
      TR_ONE_COIN_GIFTS.forEach(gift => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.referrerPolicy = 'no-referrer';
        img.src = gift.img;
        img.onerror = () => { img.dataset.failed = '1'; };
        giftImages[gift.name] = img;
      });

      if (!USE_YOUTUBE_MUSIC) {
        Object.entries(TEAM_MUSIC_URLS).forEach(([code, url]) => {
          const audio = new Audio(url);
          audio.loop = true;
          audio.volume = 0.42;
          audio.preload = 'auto';
          audio.onerror = () => { audio.dataset.failed = '1'; };
          anthemAudio[code] = audio;
        });
      }
    }

    function resize() {
      const maxDpr = window.innerWidth <= 640 ? 1.5 : 2;
      dpr = Math.max(1, Math.min(maxDpr, window.devicePixelRatio || 1));
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutTeams(true);
    }

    function dockReservedHeight() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (w <= 640) return h <= 620 ? 150 : Math.min(188, Math.max(160, h * 0.20));
      if (w <= 1050) return Math.min(240, Math.max(190, h * 0.30));
      return 156;
    }

    function trackBounds() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const leftPad = w <= 640 ? 72 : w <= 1050 ? 94 : 116;
      const top = w <= 640 ? (h <= 620 ? 146 : 158) : w <= 1050 ? 146 : 138;
      const bottom = h - dockReservedHeight() - 18;
      return {
        startX: leftPad,
        finishX: w - (w <= 640 ? 54 : 76),
        top,
        bottom: Math.max(top + (w <= 640 && h <= 620 ? 205 : 250), bottom)
      };
    }

    function layoutTeams(force) {
      const b = trackBounds();
      const laneGap = (b.bottom - b.top) / Math.max(1, teams.length - 1);
      teams.forEach((team, i) => {
        team.y = b.top + i * laneGap;
        const targetX = scoreToX(team.displayScore, b);
        if (force || !team.x) team.x = targetX;
      });
    }

    function scoreProgress(score) {
      return Math.max(0, Math.min(1, score / TARGET_SCORE));
    }

    function scoreToX(score, b) {
      const t = scoreProgress(score);
      return b.startX + (b.finishX - b.startX - 82) * t;
    }

    function normalizeText(text) {
      return String(text || '')
        .trim()
        .toLocaleUpperCase('tr-TR')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replaceAll('_', ' ')
        .replaceAll('-', ' ')
        .split(' ')
        .filter(Boolean)
        .join(' ');
    }

    function findTeamByComment(text) {
      const normalized = normalizeText(text).replaceAll(' ', '');
      if (!normalized) return null;
      const exact = teams.find(team => team.aliases.some(alias => normalizeText(alias).replaceAll(' ', '') === normalized));
      if (exact) return exact;
      return teams.find(team => normalized.includes(team.code));
    }

    function getGiftPower(giftNameOrValue, repeatCount) {
      if (typeof giftNameOrValue === 'number') {
        return Math.max(1, giftNameOrValue) * Math.max(1, repeatCount || 1);
      }
      const key = Object.keys(GIFT_POWER).find(name => normalizeText(name) === normalizeText(giftNameOrValue));
      const base = key ? GIFT_POWER[key] : 1;
      return base * Math.max(1, Number(repeatCount) || 1);
    }

    function selectedGiftName() { return giftSelect.value || 'Rose'; }

    function selectedPoints() {
      const value = Math.max(1, Math.floor(Number(activePointInput.value) || 1));
      activePointInput.value = value;
      if (giftSelect.value) GIFT_POWER[giftSelect.value] = value;
      return value;
    }

    function addPoints(team, amount, giftName, userName) {
      unlockAudio();
      if (!team || raceEnded || gameOver) return false;

      const points = Math.max(1, Math.floor(Number(amount) || 1));
      const before = team.score;
      team.score = Math.min(TARGET_SCORE, team.score + points);
      team.pulse = 1;
      team.glow = 1;

      spawnParticles(team.x - 42, team.y + 22, team.color, Math.min(42, 8 + points / 5));
      spawnSpeedLines(team.x - 58, team.y, Math.min(24, 5 + points / 8));
      spawnGiftSprite(team, giftName || selectedGiftName(), points);
      addFloatingText(team.x, team.y - 44, '+' + points, team.color);
      updatePanels();
      updateAnthem();

      if (before < TARGET_SCORE && team.score >= TARGET_SCORE) finishRace(team);
      return true;
    }

    function finishRace(team) {
      if (!team || raceEnded || gameOver) return;

      raceEnded = true;
      team.score = TARGET_SCORE;
      team.displayScore = TARGET_SCORE;
      team.raceWins += 1;
      updatePanels();
      updateAnthem();

      if (team.raceWins >= SERIES_TARGET) {
        gameOver = true;
        showCenterMessage(team.name + ' Oyunu Kazandı!', 'Toplam 5 yarış kazandı. Serinin galibi belli oldu.', 12000);
        return;
      }

      showCenterMessage(team.name + ' Yarışı Kazandı!', team.raceWins + ' / ' + SERIES_TARGET + ' oldu. Yeni yarış başlıyor.', AUTO_NEXT_RACE_DELAY - 400);
      setTimeout(startNextRace, AUTO_NEXT_RACE_DELAY);
    }

    function startNextRace() {
      if (gameOver) return;

      raceEnded = false;
      raceNumber += 1;
      activeAnthemCode = null;

      teams.forEach(team => {
        team.score = 0;
        team.displayScore = 0;
        team.pulse = 0;
        team.glow = 0;
      });

      particles.length = 0;
      floatingTexts.length = 0;
      speedLines.length = 0;
      giftSprites.length = 0;

      layoutTeams(true);
      updatePanels();
      showCenterMessage('Yeni Yarış!', 'Seride 5 yarışı alan oyunu kazanır.', 1800);
    }

    function applyComment(userName, comment) {
      if (gameOver) return false;
      const team = findTeamByComment(comment);
      if (!team) return false;
      const key = normalizeText(userName || 'viewer');
      viewerTeamByUser.set(key, team.code);
      team.pulse = 1;
      team.glow = 0.45;
      updatePanels();
      return true;
    }

    function applyGift(userName, teamCodeOrComment, giftNameOrValue, repeatCount) {
      let team = findTeamByComment(teamCodeOrComment);
      if (!team && userName) {
        const savedCode = viewerTeamByUser.get(normalizeText(userName));
        if (savedCode) team = teams.find(t => t.code === savedCode);
      }
      if (!team) return false;
      const giftName = typeof giftNameOrValue === 'number' ? 'Rose' : String(giftNameOrValue || 'Rose');
      const power = getGiftPower(giftNameOrValue || 'Rose', repeatCount || 1);
      return addPoints(team, power, giftName, userName || 'viewer');
    }

    window.applyTikTokComment = applyComment;
    window.applyTikTokGift = applyGift;
    window.addTeamPoints = function(teamCode, points) {
      const team = findTeamByComment(teamCode);
      return addPoints(team, points, selectedGiftName(), 'manual');
    };
    window.resetRace = function() {
      raceEnded = false;
      gameOver = false;
      raceNumber = 1;
      activeAnthemCode = null;
      teams.forEach(team => { team.score = 0; team.displayScore = 0; team.pulse = 0; team.glow = 0; team.raceWins = 0; });
      particles.length = 0;
      floatingTexts.length = 0;
      speedLines.length = 0;
      giftSprites.length = 0;
      updatePanels();
      layoutTeams(true);
      showCenterMessage('Oyun Sıfırlandı', '5 yarışlık seri yeniden başladı.', 1800);
    };

    function buildControls() {
      giftSelect.innerHTML = TR_ONE_COIN_GIFTS.map(gift => {
        return '<option value="' + escapeHtml(gift.name) + '">' + escapeHtml(gift.name) + '</option>';
      }).join('');
      giftSelect.value = 'Rose';
      giftSelect.addEventListener('change', () => { activePointInput.value = GIFT_POWER[giftSelect.value] || 1; });
      activePointInput.addEventListener('change', selectedPoints);
      activePointInput.value = GIFT_POWER[selectedGiftName()] || 1;

      teamGridEl.innerHTML = teams.map(team => teamCardHtml(team)).join('');
      teamGridEl.querySelectorAll('[data-add-team]').forEach(btn => {
        btn.addEventListener('click', () => {
          const team = teams.find(t => t.code === btn.dataset.addTeam);
          addPoints(team, selectedPoints(), selectedGiftName(), 'manual');
        });
      });

      const audioBtn = document.getElementById('audioUnlockBtn');
      if (audioBtn) audioBtn.addEventListener('click', unlockAudio);

      const fsBtn = document.getElementById('fullscreenBtn');
      if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
    }

    function teamCardHtml(team) {
      return '' +
        '<div class="teamCard" id="card_' + team.code + '">' +
          '<div class="teamHead">' +
            '<div class="miniFlag">' + flagMarkup(team.code) + '</div>' +
            '<div class="teamMeta"><strong>' + escapeHtml(team.name) + '</strong><span id="score_' + team.code + '">0 / 1000</span></div>' +
          '</div>' +
          '<div class="cardActions"><button data-add-team="' + team.code + '">+ Ekle</button></div>' +
          '<div class="progress"><div id="fill_' + team.code + '" class="fill" style="background: linear-gradient(90deg, ' + team.color + ', rgba(255,255,255,0.90));"></div></div>' +
        '</div>';
    }

    function updatePanels() {
      updateRanks();
      teams.forEach(team => {
        const scoreEl = document.getElementById('score_' + team.code);
        const fillEl = document.getElementById('fill_' + team.code);
        if (scoreEl) scoreEl.textContent = team.score + ' / ' + TARGET_SCORE + '  •  ' + team.raceWins + '/' + SERIES_TARGET + '  •  #' + team.rank;
        if (fillEl) fillEl.style.width = Math.min(100, scoreProgress(team.score) * 100) + '%';
      });
      updateLeaderUI();
      updateSeriesUI();
      updateSeriesBoard();
    }

    function getLeader() {
      return [...teams].sort((a, b) => b.score - a.score || b.displayScore - a.displayScore)[0];
    }

    function updateRanks() {
      const ranked = [...teams].sort((a, b) => b.score - a.score || b.displayScore - a.displayScore);
      ranked.forEach((team, index) => team.rank = index + 1);
    }

    function updateLeaderUI() {
      const leader = getLeader();
      if (!leader) return;
      leaderText.innerHTML = '<small>Lider</small>' + miniFlagHtml(leader) + '<span>' + escapeHtml(leader.code) + ' • ' + leader.score + '</span>';
      updateAnthem();
    }

    function updateSeriesUI() {
      if (!seriesText) return;

      const seriesLeader = [...teams].sort((a, b) => b.raceWins - a.raceWins || b.score - a.score || a.lane - b.lane)[0];

      if (!seriesLeader || seriesLeader.raceWins <= 0) {
        seriesText.innerHTML = '<small>Seri</small><span>0 / ' + SERIES_TARGET + '</span>';
        return;
      }

      seriesText.innerHTML = '<small>Seri</small>' + miniFlagHtml(seriesLeader) + '<span>' + escapeHtml(seriesLeader.code) + ' • ' + seriesLeader.raceWins + ' / ' + SERIES_TARGET + '</span>';
    }

    function isFullscreenActive() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement
      );
    }

    async function toggleFullscreen() {
      const root = document.documentElement;

      try {
        if (!isFullscreenActive()) {
          if (root.requestFullscreen) {
            await root.requestFullscreen({ navigationUI: 'hide' });
          } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
          } else if (root.msRequestFullscreen) {
            root.msRequestFullscreen();
          } else {
            showCenterMessage('Tam ekran desteklenmiyor', 'Telefonda tarayıcı menüsünden ana ekrana ekleyerek daha geniş açabilirsin.', 4200);
            return;
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        }
      } catch (err) {
        showCenterMessage('Tam ekran açılamadı', 'Mobil tarayıcı izin vermediyse sayfayı ana ekrana ekleyip oradan aç.', 4200);
      }

      updateFullscreenButton();
      setTimeout(resize, 160);
    }

    function updateFullscreenButton() {
      const btn = document.getElementById('fullscreenBtn');
      if (!btn) return;
      btn.textContent = isFullscreenActive() ? 'Çık' : 'Tam Ekran';
    }

    function updateSeriesBoard() {
      if (!seriesBoard) return;

      seriesBoard.innerHTML = teams.map(team => {
        return '' +
          '<div class="seriesChip">' +
            '<div class="miniFlag">' + flagMarkup(team.code) + '</div>' +
            '<div class="seriesInfo">' +
              '<span class="seriesName">' + escapeHtml(team.name) + '</span>' +
              '<span class="seriesScore">' + team.raceWins + '/' + SERIES_TARGET + '</span>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;

      const btn = document.getElementById('audioUnlockBtn');
      if (btn) btn.textContent = 'Müzik Açık';

      if (USE_YOUTUBE_MUSIC) {
        loadYouTubeMusicPlayer();
        setTimeout(updateAnthem, 500);
        return;
      }

      Object.values(anthemAudio).forEach(audio => {
        audio.volume = 0;
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          audio.volume = 0.42;
        }).catch(() => { audio.volume = 0.42; });
      });

      setTimeout(updateAnthem, 120);
    }

    function updateAnthem() {
      if (!audioUnlocked) return;
      const leader = getLeader();
      if (!leader || activeAnthemCode === leader.code) return;
      activeAnthemCode = leader.code;

      if (USE_YOUTUBE_MUSIC) {
        playTeamYoutubeMusic(leader.code);
        return;
      }

      Object.entries(anthemAudio).forEach(([code, audio]) => {
        if (code !== leader.code) {
          audio.pause();
          audio.currentTime = 0;
        }
      });
      const active = anthemAudio[leader.code];
      if (active) {
        if (active.dataset.failed === '1') {
          showCenterMessage('Müzik dosyası yok', TEAM_MUSIC_URLS[leader.code] + ' bulunamadı.', 3600);
          return;
        }
        active.volume = 0.42;
        active.loop = true;
        active.play().catch(() => {
          showCenterMessage('Müzik başlatılamadı', 'Mobilde önce Müzik Aç butonuna bir kez basman gerekiyor.', 3600);
        });
      }
    }

    function loadYouTubeMusicPlayer() {
      if (!USE_YOUTUBE_MUSIC) return;
      if (youtubePlayer || youtubeApiLoading) return;

      youtubeApiLoading = true;
      window.onYouTubeIframeAPIReady = function() {
        youtubePlayer = new YT.Player('youtubePlayer', {
          width: 220,
          height: 220,
          videoId: TEAM_YOUTUBE_IDS.TR,
          playerVars: {
            playsinline: 1,
            controls: 0,
            rel: 0,
            modestbranding: 1,
            disablekb: 1,
            fs: 0
          },
          events: {
            onReady: function(event) {
              youtubeReady = true;
              try { event.target.setVolume(46); } catch (e) {}
              if (pendingYoutubeTeamCode) playTeamYoutubeMusic(pendingYoutubeTeamCode, true);
            },
            onError: function() {
              showCenterMessage('YouTube müziği açılamadı', 'Video sahibi embed izni vermemiş olabilir. Video ID değiştir.', 4200);
            },
            onStateChange: function(event) {
              if (event.data === YT.PlayerState.ENDED && activeAnthemCode) {
                playTeamYoutubeMusic(activeAnthemCode, true);
              }
            }
          }
        });
      };

      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }

    function playTeamYoutubeMusic(teamCode, force) {
      pendingYoutubeTeamCode = teamCode;
      loadYouTubeMusicPlayer();

      if (!youtubeReady || !youtubePlayer || !youtubePlayer.loadVideoById) return;

      const videoId = TEAM_YOUTUBE_IDS[teamCode] || TEAM_YOUTUBE_IDS.TR;

      try {
        youtubePlayer.loadVideoById({ videoId: videoId, startSeconds: 0 });
        youtubePlayer.setVolume(46);
        youtubePlayer.playVideo();
      } catch (err) {
        showCenterMessage('Müzik başlatılamadı', 'Müzik Aç butonuna tekrar basmayı dene.', 3600);
      }
    }

        for (let rx = b.startX - 10; rx < b.finishX - 10; rx += 112) { ctx.fillStyle = 'rgba(253,230,138,0.45)'; roundRect(ctx, rx, y-3, 32, 6, 4); ctx.fill(); }

        suv:{w:142,h:70,wheel:19,ground:38,spoiler:false,roof:0.52},
        hyper:{w:152,h:52,wheel:16,ground:28,spoiler:true,roof:0.34},
        formula:{w:158,h:46,wheel:18,ground:26,spoiler:true,roof:0.24}
      }[type] || {w:144,h:56,wheel:16,ground:30,spoiler:true,roof:0.4};
    }

    function drawCar(team) {
      const x = team.x, y = team.y;
      const scale = carScale() * (1 + team.pulse * 0.035);
      const specs = getCarSpecs(team.carType);
      const carW = specs.w * scale;
      const carH = specs.h * scale;
      const bodyY = y - carH * 0.04;

      ctx.save();
      ctx.globalAlpha = 0.20 + team.glow * 0.28;
      const glow = ctx.createRadialGradient(x, y, 12, x, y, 112 * carScale());
      glow.addColorStop(0, team.color); glow.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.ellipse(x, y, 124*carScale(), 50*carScale(), 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.54)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 10;
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(x-3*scale, y+specs.ground*scale, carW*0.50, 9*scale, 0, 0, Math.PI*2); ctx.fill();
      if (team.carType === 'formula') drawFormulaBody(team, x, bodyY, carW, carH, scale);
      else if (team.carType === 'suv') drawSuvBody(team, x, bodyY, carW, carH, scale);
      else if (team.carType === 'muscle') drawMuscleBody(team, x, bodyY, carW, carH, scale);
      else drawSportBody(team, x, bodyY, carW, carH, scale, specs.roof);
      ctx.shadowColor = 'transparent';
      drawCarDetails(team, x, y, bodyY, carW, carH, scale, specs);
      ctx.restore();
    }

    function drawSportBody(team, x, bodyY, carW, carH, scale, roof) {
      const metallic = ctx.createLinearGradient(x-carW*0.5, bodyY-carH*0.35, x+carW*0.5, bodyY+carH*0.3);
      metallic.addColorStop(0, darkenColor(team.color, 0.35)); metallic.addColorStop(0.28, team.color); metallic.addColorStop(0.62, darkenColor(team.color, 0.05)); metallic.addColorStop(1, darkenColor(team.color, 0.42));
      ctx.fillStyle = metallic;
      ctx.beginPath();
      ctx.moveTo(x-carW*0.52, bodyY+carH*0.15);
      ctx.quadraticCurveTo(x-carW*0.46, bodyY-carH*0.12, x-carW*0.20, bodyY-carH*0.17);
      ctx.lineTo(x+carW*0.42, bodyY-carH*0.13);
      ctx.quadraticCurveTo(x+carW*0.58, bodyY, x+carW*0.55, bodyY+carH*0.18);
      ctx.lineTo(x+carW*0.44, bodyY+carH*0.28);
      ctx.lineTo(x-carW*0.45, bodyY+carH*0.28);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = lightenColor(team.color, 0.10);
      roundRect(ctx, x-carW*0.18, bodyY-carH*0.38, carW*roof, carH*0.30, 12*scale); ctx.fill();
    }

    function drawMuscleBody(team, x, bodyY, carW, carH, scale) {
      const metallic = ctx.createLinearGradient(x-carW*0.5, bodyY-carH*0.35, x+carW*0.5, bodyY+carH*0.3);
      metallic.addColorStop(0, darkenColor(team.color, 0.44)); metallic.addColorStop(0.38, team.color); metallic.addColorStop(1, darkenColor(team.color, 0.38));
      ctx.fillStyle = metallic;
      ctx.beginPath();
      ctx.moveTo(x-carW*0.54, bodyY+carH*0.14); ctx.lineTo(x-carW*0.46, bodyY-carH*0.11); ctx.lineTo(x+carW*0.43, bodyY-carH*0.14); ctx.lineTo(x+carW*0.56, bodyY+carH*0.10); ctx.lineTo(x+carW*0.48, bodyY+carH*0.25); ctx.lineTo(x-carW*0.50, bodyY+carH*0.25); ctx.closePath(); ctx.fill();
      ctx.fillStyle = lightenColor(team.color, 0.05); roundRect(ctx, x-carW*0.15, bodyY-carH*0.42, carW*0.36, carH*0.32, 8*scale); ctx.fill();
    }

    function drawSuvBody(team, x, bodyY, carW, carH, scale) {
      ctx.fillStyle = darkenColor(team.color, 0.24); roundRect(ctx, x-carW*0.48, bodyY-carH*0.08, carW*0.96, carH*0.49, 11*scale); ctx.fill();
      ctx.fillStyle = team.color; roundRect(ctx, x-carW*0.27, bodyY-carH*0.48, carW*0.50, carH*0.43, 10*scale); ctx.fill();
      ctx.fillStyle = 'rgba(15,23,42,0.92)'; roundRect(ctx, x-carW*0.43, bodyY-carH*0.27, carW*0.12, carH*0.17, 3*scale); ctx.fill();
    }

    function drawFormulaBody(team, x, bodyY, carW, carH, scale) {
      ctx.fillStyle = darkenColor(team.color, 0.08);
      ctx.beginPath(); ctx.moveTo(x-carW*0.52, bodyY+carH*0.02); ctx.lineTo(x-carW*0.14, bodyY-carH*0.13); ctx.lineTo(x+carW*0.58, bodyY-carH*0.02); ctx.lineTo(x+carW*0.64, bodyY+carH*0.12); ctx.lineTo(x-carW*0.40, bodyY+carH*0.19); ctx.closePath(); ctx.fill();
      ctx.fillStyle = team.color; roundRect(ctx, x-carW*0.20, bodyY-carH*0.22, carW*0.25, carH*0.24, 8*scale); ctx.fill();
      ctx.fillStyle = darkenColor(team.color, 0.30); roundRect(ctx, x-carW*0.60, bodyY-carH*0.02, carW*0.13, carH*0.20, 4*scale); ctx.fill();
    }

    function drawCarDetails(team, x, y, bodyY, carW, carH, scale, specs) {
      ctx.fillStyle = 'rgba(219,234,254,0.88)';
      roundRect(ctx, x-carW*0.13, bodyY-carH*0.32, carW*0.16, carH*0.17, 5*scale); ctx.fill();
      roundRect(ctx, x+carW*0.06, bodyY-carH*0.32, carW*0.14, carH*0.17, 5*scale); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.moveTo(x-carW*0.43, bodyY-carH*0.02); ctx.lineTo(x+carW*0.37, bodyY-carH*0.08); ctx.lineTo(x+carW*0.43, bodyY-carH*0.02); ctx.lineTo(x-carW*0.37, bodyY+carH*0.06); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(253,230,138,0.98)'; ctx.beginPath(); ctx.moveTo(x+carW*0.46, bodyY+carH*0.02); ctx.lineTo(x+carW*0.59, bodyY+carH*0.07); ctx.lineTo(x+carW*0.47, bodyY+carH*0.16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(248,113,113,0.94)'; roundRect(ctx, x-carW*0.53, bodyY+carH*0.02, carW*0.05, carH*0.15, 3*scale); ctx.fill();
      if (specs.spoiler) { ctx.fillStyle = darkenColor(team.color,0.32); roundRect(ctx, x-carW*0.53, bodyY-carH*0.23, carW*0.19, carH*0.06, 3*scale); ctx.fill(); }

      const sideFlagW = Math.min(carW * 0.54, carH * 1.72);
      const sideFlagH = sideFlagW * 0.66;
      drawFlagCanvas(team.code, x - sideFlagW * 0.34, bodyY - sideFlagH * 0.32, sideFlagW, sideFlagH, 7 * scale);
      const wheelY = y + specs.ground * scale;
      drawWheel(x-carW*0.31, wheelY, specs.wheel*scale, team.accent);
      drawWheel(x+carW*0.32, wheelY, specs.wheel*scale, team.accent);

      drawCarWinText(team, x, y - carH * 0.48, scale);
      drawCarGloss(team, x, bodyY, carW, carH, scale);

      const scoreFont = window.innerWidth <= 640 ? Math.max(24, 34 * scale) : Math.max(34, 44 * scale);
      ctx.fillStyle = 'rgba(255,255,255,0.98)';
      ctx.font = '1000 ' + scoreFont + 'px system-ui';
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(2,6,23,0.92)';
      ctx.lineWidth = Math.max(5, scoreFont * 0.22);
      const scoreY = y - carH * 0.82;
      ctx.strokeText(team.score, x, scoreY);
      ctx.fillText(team.score, x, scoreY);
    }

    function drawCarWinText(team, x, y, scale) {
      const fontSize = Math.max(11, 14 * scale);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '1000 ' + fontSize + 'px system-ui';
      ctx.fillStyle = '#fde68a';
      ctx.strokeStyle = 'rgba(2,6,23,0.94)';
      ctx.lineWidth = Math.max(4, fontSize * 0.28);
      const text = team.raceWins + '/' + SERIES_TARGET;
      ctx.strokeText(text, x, y);
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawCarGloss(team, x, bodyY, carW, carH, scale) {
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,0.50)';
      ctx.lineWidth = Math.max(2, 3.2 * scale);
      ctx.beginPath();
      ctx.moveTo(x - carW * 0.35, bodyY - carH * 0.04);
      ctx.quadraticCurveTo(x - carW * 0.05, bodyY - carH * 0.19, x + carW * 0.34, bodyY - carH * 0.09);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(253,230,138,0.72)';
      ctx.lineWidth = Math.max(2, 2.4 * scale);
      ctx.beginPath();
      ctx.moveTo(x - carW * 0.40, bodyY + carH * 0.20);
      ctx.lineTo(x + carW * 0.38, bodyY + carH * 0.20);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      ctx.ellipse(x + carW * 0.52, bodyY + carH * 0.10, carW * 0.12, carH * 0.10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawWheel(x, y, r, accent) {
      ctx.save(); ctx.fillStyle = '#020617'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(x,y,r*0.70,0,Math.PI*2); ctx.fill(); ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(x,y,r*0.34,0,Math.PI*2); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.38)'; ctx.lineWidth = Math.max(1, r*0.12); ctx.beginPath(); ctx.arc(x,y,r*0.47,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }

    function drawPersistentFrontGift(team, time) {
      const giftName = TEAM_DEFAULT_GIFT[team.code] || 'Rose';
      const img = giftImages[giftName];
      const cw = carWidth(team);
      const size = window.innerWidth <= 640 ? 38 : 54;
      const flow = (Math.sin(time * 2.4 + team.lane * 0.9) * 0.5 + 0.5);
      const extraFront = 34 + flow * 34;
      const x = team.x + cw * 0.54 + extraFront;
      const y = team.y - size * 0.55 + Math.sin(time * 3.0 + team.lane) * 4;
      drawGiftImage(img, x, y, size, team.color);
    }

    function spawnGiftSprite(team, giftName, points) {
      giftSprites.push({ team, giftName: giftName || 'Rose', points, age: 0, life: 1.12, startOffset: 18, endOffset: 94, bob: Math.random() * Math.PI * 2 });
    }

    function drawGiftSprites(dt) {
      for (let i = giftSprites.length - 1; i >= 0; i--) {
        const g = giftSprites[i];
        g.age += dt;
        const t = Math.min(1, g.age / g.life);
        if (t >= 1) { giftSprites.splice(i, 1); continue; }
        const cw = carWidth(g.team);
        const size = (window.innerWidth <= 640 ? 46 : 66) * (1 + Math.sin(t * Math.PI) * 0.25);
        const x = g.team.x + cw * 0.52 + g.startOffset + (g.endOffset - g.startOffset) * easeOutCubic(t);
        const y = g.team.y - size * 0.62 + Math.sin(g.bob + t * Math.PI * 4) * 6;
        const alpha = 1 - Math.max(0, (t - 0.78) / 0.22);
        ctx.save();
        ctx.globalAlpha = alpha;
        drawGiftImage(giftImages[g.giftName], x, y, size, g.team.color);
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#fff';
        ctx.font = '1000 ' + Math.max(15, size * 0.34) + 'px system-ui';
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(2,6,23,0.90)';
        ctx.lineWidth = 5;
        const txt = '+' + g.points;
        ctx.strokeText(txt, x, y + size * 0.82);
        ctx.fillText(txt, x, y + size * 0.82);
        ctx.restore();
      }
    }

    function drawGiftImage(img, x, y, size, color) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.48)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.beginPath(); ctx.arc(x, y, size * 0.70, 0, Math.PI * 2); ctx.fill();
      if (img && img.complete && img.naturalWidth > 0 && img.dataset.failed !== '1') {
        ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
      } else {
        drawFallbackOrb(x, y, size, color);
      }
      ctx.restore();
    }

    function drawFallbackOrb(x, y, size, color) {
      const grad = ctx.createRadialGradient(x - size * 0.15, y - size * 0.20, 2, x, y, size * 0.68);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.30, lightenColor(color, 0.55));
      grad.addColorStop(1, darkenColor(color, 0.15));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, size * 0.48, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.86)'; ctx.lineWidth = Math.max(1.4, size * 0.045); ctx.stroke();
    }

    function drawParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.life -= dt; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vx *= 0.985; p.vy *= 0.985;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.maxLife); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
    }

    function drawSpeedLines(dt) {
      for (let i = speedLines.length - 1; i >= 0; i--) {
        const s = speedLines[i]; s.life -= dt; s.x -= 2.2 * dt * 60;
        if (s.life <= 0) { speedLines.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, s.life / s.maxLife) * 0.55; ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.len,s.y); ctx.stroke(); ctx.restore();
      }
    }

    function drawFloatingTexts(dt) {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const f = floatingTexts[i]; f.age += dt; f.life -= dt; f.y -= dt * 28;
        if (f.life <= 0) { floatingTexts.splice(i,1); continue; }
        ctx.save(); ctx.globalAlpha = Math.max(0, f.life); ctx.textAlign = 'center'; ctx.font = '1000 22px system-ui'; ctx.strokeStyle = 'rgba(2,6,23,0.88)'; ctx.lineWidth = 6; ctx.strokeText(f.text,f.x,f.y); ctx.fillStyle = '#fff'; ctx.fillText(f.text,f.x,f.y); ctx.restore();
      }
    }

    function update(dt) {
      const b = trackBounds();
      teams.forEach(team => {
        team.displayScore += (team.score - team.displayScore) * Math.min(1, dt * 6.8);
        const targetX = scoreToX(team.displayScore, b);
        team.x += (targetX - team.x) * Math.min(1, dt * 9);
        team.pulse *= Math.pow(0.86, dt * 60);
        team.glow *= Math.pow(0.90, dt * 60);
      });
    }

    function draw() {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastTime) / 1000); lastTime = now;
      const time = now / 1000;
      const w = window.innerWidth, h = window.innerHeight;
      update(dt);
      layoutTeams(false);
      drawBackground(w,h);
      drawSpeedLines(dt);
      const sortedTeams = [...teams].sort((a,b)=>a.y-b.y);
      sortedTeams.forEach(team => {
        drawCar(team);
        drawPersistentFrontGift(team, time);
      });
      drawGiftSprites(dt);
      drawParticles(dt);
      drawFloatingTexts(dt);
      requestAnimationFrame(draw);
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.PI + (Math.random()-0.5)*1.25;
        const speed = 0.7 + Math.random()*3.0;
        particles.push({x,y,vx:Math.cos(angle)*speed-1.8,vy:Math.sin(angle)*speed,life:0.65+Math.random()*0.45,maxLife:1.1,size:2+Math.random()*4,color});
      }
    }

    function spawnSpeedLines(x, y, count) { for (let i=0;i<count;i++) speedLines.push({x:x-Math.random()*48,y:y+(Math.random()-0.5)*44,len:28+Math.random()*48,life:0.38+Math.random()*0.26,maxLife:0.62}); }
    function addFloatingText(x, y, text, color) { floatingTexts.push({x,y,text,color,life:1.05,age:0}); }
    function showCenterMessage(big, sub, duration) { centerBig.textContent = big; centerSub.textContent = sub; centerMessage.classList.add('show'); clearTimeout(showCenterMessage.t); showCenterMessage.t = setTimeout(()=>centerMessage.classList.remove('show'), duration || 2600); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function darkenColor(hex, amount) { return mixColor(hex, '#020617', amount); }
    function lightenColor(hex, amount) { return mixColor(hex, '#ffffff', amount); }
    function mixColor(hex, other, amount) { const a=hexToRgb(hex), b=hexToRgb(other); const r=Math.round(a.r+(b.r-a.r)*amount), g=Math.round(a.g+(b.g-a.g)*amount), bl=Math.round(a.b+(b.b-a.b)*amount); return 'rgb('+r+', '+g+', '+bl+')'; }
    function hexToRgb(hex) { const clean=String(hex || '#ffffff').replace('#',''); const bigint=parseInt(clean,16); return {r:(bigint>>16)&255,g:(bigint>>8)&255,b:bigint&255}; }
    function roundRect(ctx,x,y,w,h,r){ const radius=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+radius,y); ctx.arcTo(x+w,y,x+w,y+h,radius); ctx.arcTo(x+w,y+h,x,y+h,radius); ctx.arcTo(x,y+h,x,y,radius); ctx.arcTo(x,y,x+radius,y,radius); ctx.closePath(); }
    function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    function star(cx,cy,outer,inner,color){ ctx.save(); ctx.fillStyle=color; ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const r=i%2===0?outer:inner; const x=cx+Math.cos(a)*r; const y=cy+Math.sin(a)*r; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.closePath(); ctx.fill(); ctx.restore(); }

    window.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
    document.addEventListener('msfullscreenchange', updateFullscreenButton);
    window.addEventListener('pointerdown', unlockAudio, { once: true });

    preloadAssets();
    resize();
    buildControls();
    updatePanels();
    showCenterMessage('Yarış Hazır!', '5 yarışı kazanan oyunun galibi olur.', 2400);
    requestAnimationFrame(draw);
  </script>
</body>
